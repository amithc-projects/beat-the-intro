<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat the Intro - Test Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
    <div class="fixed inset-0 grainy-bg z-[100]"></div>
    
    <main class="relative min-h-screen w-full flex flex-col items-center justify-center p-8">
        <div id="login-view" class="w-full max-w-md space-y-8 text-center">
            <h1 class="text-6xl font-black italic tracking-tighter uppercase">Beat the <span class="text-primary-container">Intro</span></h1>
            <p class="text-on-surface-variant uppercase tracking-widest font-bold">Standalone Test Flow</p>
            <button id="login-btn" class="w-full bg-primary-container text-black font-black text-xl py-6 flex items-center justify-center gap-4 offset-border active-glitch transition-all uppercase tracking-tighter">
                <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
                Connect with Spotify
            </button>
        </div>

        <div id="playlist-view" class="w-full max-w-4xl space-y-8 hidden">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Select a <span class="text-primary-container">Playlist</span></h2>
            <div id="playlist-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Playlists will be injected here -->
            </div>
        </div>

        <div id="player-view" class="w-full max-w-2xl space-y-8 hidden text-center">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Now <span class="text-primary-container">Playing</span></h2>
            <div id="track-info" class="p-8 bg-surface-container-low border-2 border-primary-container space-y-4">
                <img id="album-art" class="w-64 h-64 mx-auto object-cover border-2 border-white" src="" alt="Album Art">
                <div class="space-y-2">
                    <p id="track-name" class="text-2xl font-black uppercase tracking-tighter"></p>
                    <p id="artist-name" class="text-lg font-bold text-primary-container uppercase tracking-widest"></p>
                </div>
            </div>
            <div class="flex flex-col gap-4">
                <button id="play-random-btn" class="w-full bg-primary-container text-black font-black text-xl py-4 offset-border active-glitch transition-all uppercase tracking-tighter">
                    Play Another Random Track
                </button>
                <button id="back-to-playlists-btn" class="w-full border-2 border-white text-white font-black text-xl py-4 active-glitch transition-all uppercase tracking-tighter">
                    Back to Playlists
                </button>
            </div>
        </div>

        <div id="status-display" class="fixed bottom-8 right-8 z-50 bg-surface-container-highest/80 backdrop-blur-md p-4 border-r-4 border-primary-container">
            <span id="status-text" class="text-xs font-mono font-bold text-white tracking-tighter uppercase">INITIALIZING...</span>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
