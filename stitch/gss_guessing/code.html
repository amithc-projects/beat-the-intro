<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-20 bg-[#131313] border-b-4 border-[#D1FF00]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-surface-container-highest border-2 border-primary-container overflow-hidden rounded-none">
<img alt="Spotify User Profile" class="w-full h-full object-cover" data-alt="Abstract vibrant geometric profile avatar with high contrast neon green and black shapes" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaLW2R0rD1B2yD1plw1O7dAeyGUYaZJCEqMdSrL0H4z62owpVkqn-T27TparOlYG003eYUPvxN0avfClfwD-a5Tj7xLR4ePDdE3qeEi_3NDmmxJVyTJrd7ez9mdkGUuJJg_QBDLA-EZU5vBk0_TiiUz1pt1pH5QnbnvAgc8dS_EhUO6Pu5w87bnpKMMnUJ3JcYzkdDEMNR9LPQL8Fj7I0fd1YixwDrBoxlUnrSJKbzfN1IvYl7ZheO-728MAQJfRAPqcdrxwC0pK4"/>
</div>
<span class="text-2xl font-black italic tracking-tighter text-[#D1FF00] font-headline uppercase">BEAT THE INTRO</span>
</div>
<button class="text-[#D1FF00] hover:bg-[#D1FF00] hover:text-black transition-all duration-75 p-2 active:translate-x-1 active:translate-y-1">
<span class="material-symbols-outlined text-3xl">settings</span>
</button>
</nav>
<!-- Main Content Canvas -->
<main class="pt-24 pb-20 px-6 max-w-5xl mx-auto flex flex-col md:flex-row gap-8 min-h-[calc(100vh-144px)]">
<!-- Left Column: Context (Now Paused Track Visuals) -->
<section class="flex-1 flex flex-col justify-center gap-8">
<div class="relative group">
<!-- Hard Layering Artwork -->
<div class="absolute -inset-2 bg-primary-container translate-x-1 translate-y-1 -z-10"></div>
<div class="aspect-square w-full max-w-[400px] mx-auto bg-surface-container-high border-2 border-primary relative overflow-hidden grayscale contrast-125">
<img alt="Track Art" class="w-full h-full object-cover mix-blend-overlay" data-alt="High contrast black and white photography of a grainy DJ mixer and vinyl records in a dark underground club" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvEazLMYGIRU28QEXRJn0GygiZevxbxPFafnQfxfBnLgU393QAjKWXZOvfy1FEqPZvvy_Lr-kG3G7oZXO9k3j5juCts3Lj2chortThRqxeykxsxlUCTvSItTtd436_gc7e3_p-Z_ejPz6tnZD5goP6XVMl3p_ujBhGrlPQMacXIl9Ew1l9-8HbylCAj-bKNFH13xxXWsMwS1VngED-MZ4ny6gRCX0fhJ3DPm_oscQ6eTJGq77xclfScROtUkX78Uo0Q69vdGQTuiI"/>
<div class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm">
<div class="text-center p-6 border-4 border-primary-container">
<span class="material-symbols-outlined text-7xl text-primary-container font-black">pause_circle</span>
<p class="font-headline font-black text-2xl uppercase tracking-tighter mt-4 text-primary">PLAYBACK PAUSED</p>
</div>
</div>
</div>
</div>
<div class="space-y-2">
<div class="flex items-center gap-2">
<span class="bg-primary text-black px-2 py-0.5 text-[10px] font-black tracking-widest uppercase">STATUS</span>
<span class="text-primary-container font-black text-sm tracking-tighter">WAITING FOR GUESS...</span>
</div>
<h1 class="font-headline text-5xl md:text-6xl font-black italic tracking-tighter uppercase leading-[0.9] text-primary">
                    ???<span class="text-primary-container">_</span>
</h1>
<p class="font-headline text-2xl font-bold uppercase text-on-surface-variant opacity-70 italic">
                    ARTIST UNKNOWN
                </p>
</div>
<!-- Pulse Progress Bar (Static while paused) -->
<div class="w-full h-4 bg-surface-container-highest border-2 border-primary-container">
<div class="w-1/3 h-full bg-primary-container shadow-[0_0_15px_rgba(209,255,0,0.5)]"></div>
</div>
</section>
<!-- Right Column: Guessing Form (Aurora Brutalist Design) -->
<section class="flex-1 flex flex-col justify-center">
<div class="bg-surface-container-low p-8 border-4 border-primary relative">
<div class="absolute -top-4 -left-4 bg-primary-container text-black px-4 py-1 font-black text-sm uppercase tracking-tighter transform -rotate-2">
                    INPUT_YOUR_INTEL
                </div>
<form class="space-y-10 mt-6" onsubmit="return false">
<div class="flex flex-col md:flex-row gap-6">
<!-- Artist Name Input -->
<div class="flex-1 group">
<label class="block font-label text-[10px] font-bold tracking-[5%] text-primary-container uppercase mb-2">
                                01_Artist Name
                            </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-0 border-b-4 border-primary text-primary font-headline font-black text-xl uppercase py-4 px-4 placeholder:text-white/20 focus:ring-0 focus:border-primary-container transition-all" placeholder="ENTER ARTIST..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-20">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</div>
</div>
<!-- Song Title Input -->
<div class="group">
<label class="block font-label text-[10px] font-bold tracking-[5%] text-primary-container uppercase mb-2">
                            02_Song Title
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-0 border-b-4 border-primary text-primary font-headline font-black text-xl uppercase py-4 px-4 placeholder:text-white/20 focus:ring-0 focus:border-primary-container transition-all" placeholder="WHAT IS THE TRACK?" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-20">
<span class="material-symbols-outlined">music_note</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 pt-6">
<button class="w-full bg-[#D1FF00] text-black font-headline font-black text-2xl py-6 uppercase tracking-tighter brutal-shadow hover:translate-x-1 hover:translate-y-1 hover:shadow-none active:scale-95 transition-all flex items-center justify-center gap-3">
                            SUBMIT GUESS
                            <span class="material-symbols-outlined font-black">send</span>
</button>
<button class="w-full border-4 border-primary text-primary font-headline font-black text-xl py-4 uppercase tracking-tighter hover:bg-primary hover:text-black transition-all active:scale-95 flex items-center justify-center gap-3">
                            RESUME LISTENING
                            <span class="material-symbols-outlined">play_circle</span>
</button>
</div>
</form>
<!-- Metadata/Specs Layout -->
<div class="mt-8 flex justify-between items-end">
<div class="space-y-1">
<p class="text-[10px] font-bold tracking-widest text-on-surface-variant uppercase">Time Bonus</p>
<p class="text-primary-container font-black font-headline text-xl">+1250 pts</p>
</div>
<div class="text-right">
<p class="text-[10px] font-bold tracking-widest text-on-surface-variant uppercase">Attempts</p>
<p class="text-primary font-black font-headline text-xl">1/3</p>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-16 z-50 flex justify-around items-stretch bg-[#131313] border-t-4 border-[#D1FF00]">

<span class="material-symbols-outlined">play_arrow</span>
<span class="font-['Space_Grotesk'] font-bold tracking-[5%] text-[10px]">PLAY</span>
</a>
<a class="flex flex-col items-center justify-center text-white h-full px-4 opacity-80 flex-1 hover:bg-white hover:text-black transition-colors duration-100" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="font-['Space_Grotesk'] font-bold tracking-[5%] text-[10px]">DISCOVER</span>
</a>
<a class="flex flex-col items-center justify-center text-white h-full px-4 opacity-80 flex-1 hover:bg-white hover:text-black transition-colors duration-100" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-['Space_Grotesk'] font-bold tracking-[5%] text-[10px]">RANK</span>
</a>
<a class="flex flex-col items-center justify-center text-white h-full px-4 opacity-80 flex-1 hover:bg-white hover:text-black transition-colors duration-100" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-['Space_Grotesk'] font-bold tracking-[5%] text-[10px]">PROFILE</span>
